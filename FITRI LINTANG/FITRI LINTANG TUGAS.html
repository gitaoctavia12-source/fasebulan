<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase-Fase Bulan</title>
    <style>
        /* CSS untuk Styling */
        :root {
            --electric-blue: #1a71c9; /* Warna Biru Elektrik */
            --dark-background:  #475077;
            --text-color: #b6d4eb ;
            --highlight-color: #ffad33;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--dark-background);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: var(--electric-blue);
            color: var(--dark-background);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            text-transform: uppercase;
        }

        .container {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
        }

        .movie-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .movie-card {
            background-color: #17175f;
            border: 2px solid var(--electric-blue);
            border-radius: 10px;
            width: 250px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 15px #0000b3(0, 175, 255, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 175, 255, 0.8);
        }

        .movie-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--highlight-color);
        }

        .movie-card h3 {
            color: var(--highlight-color);
            font-size: 1.2em;
            margin-top: 0;
        }

        .btn-detail {
            background-color: var(--electric-blue);
            color: var(--dark-background);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-detail:hover {
            background-color: #007ACC; /* sedikit lebih gelap */
        }

        /* Styling Pop-up (Modal) */
        .modal {
            display: none; /* Tersembunyi secara default */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.8);
            padding-top: 60px;
        }

        .modal-content {
            background-color: var(--dark-background);
            margin: 5% auto;
            padding: 20px;
            border: 3px solid var(--electric-blue);
            width: 80%;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 0 20px var(--electric-blue);
            text-align: center;
        }

        .close-btn {
            color: var(--electric-blue);
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close-btn:hover,
        .close-btn:focus {
            color: var(--highlight-color);
            text-decoration: none;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 15px 0;
            background-color: #1B263B;
            color: var(--electric-blue);
            margin-top: 40px;
            border-top: 2px solid var(--electric-blue);
        }
    </style>
</head>
<body>

    <header>
        <h1></h1>
    </header>

    <div class="container">
        <div class="movie-list">

            <div class="movie-card" onclick="openModal('Bulan baru disebut juga bulan mati merupakan fase bulan pertama. Fase bulan baru ini terjadi pada saat Bulan berada antara Matahari dan Bumi dalam posisi sejajar. Bulan baru biasanya terjadi pada siang hari sehingga tidak dapat melihatnya karena sinar matahari lebih terang.')">
                <img src="new.jpg" alt="Poster Film F1">
                <h3>Bulan Baru</h3>
                <button class="btn-detail">Lihat Detail</button>
            </div>

            <div class="movie-card" onclick="openModal('Sinar matahari mengenai bagian bulan yang menghadap bumi semakin bertambah pada pekan pertama awal fase bulan.   Pada fase bulan sabit, bagian bulan yang mendapat sinar matahari kurang dari setengahnya.Bentuk bulan sabit yang terlihat dari bumi dapat terlihat saat dua fase yaitu fase waxing crescent (bulat sabit awal) dan waning crescent (bulat sabit akhir).')">
                <img src="bit.jpg" alt="Poster Avengers: Endgame">
                <h3>Bulan Sabit</h3>
                <button class="btn-detail">Lihat Detail</button>
            </div>

            <div class="movie-card" onclick="openModal('Bentuk bulan perbani dalam satu peride fase bulan terjadi dalam dua fase yaitu pada kuartal pertama (first quarter) dan seperempat ketiga (third quarter). Fase bulan ini terjadi ketika bulan berada pada sudut 90o antara bumi dan matahari.  Pada fase ini, bentuk Bulan dari permukaan bumi terlihat setengah bulan terang dan setengah bulan dalam bayangan. Sehingga, fase bulan perbani biasa juga disebut sebagai fase setengah bulan.')">
                <img src="per.webp" alt="Poster Interstellar">
                <h3>Bulan Perbani</h3>
                <button class="btn-detail">Lihat Detail</button>
            </div>

            <div class="movie-card" onclick="openModal('Bentuk bulan cembung terlihat hampir pada seluruh bagian bulan yang menghadap bumi. yang disinari oleh matahari terlihat bersinar. Bentuk bulan cembung dapat terlihat dalam dua fase pasa satu periode fase bulan yaitu pada bagian awal (waxing gibbous) dan bagian akhir (waning gibbous).')">
                <img src="cem.webp" alt="Poster A Working Man">
                <h3>Bulan Cembung</h3>
                <button class="btn-detail">Lihat Detail</button>
            </div>

            <div class="movie-card" onclick="openModal('Pada bulan purnama, bulan, bumi, dan matahari juga berada pada posisi yang sejajar seperti bulan baru. Posisi pada fase ini bulan berada pada sisi yang berlawanan dari bumi sehingga seluruh bagian bulan yang diterangi matahari menghadap ke bumi. Bagian yang tidak diterangi tersembunyi sepenuhnya.  Bulan purnama biasanya terjadi di antara hari ke–14  dan hari ke–5 dalam kalender lunar. Pada fase ini, posisi bulan menyebabkan pasang air laut terbesar di bumi yang disebut pasang purnama.')">
                <img src="pur.jpg" alt="Poster The Shadow Stray">
                <h3>Bulan Purnama</h3>
                <button class="btn-detail">Lihat Detail</button>
            </div>
            <div class="movie-card" onclick="openModal('Fase bulan adalah perubahan bentuk bulan yang terlihat dari Bumi, yang terjadi karena posisi bulan terhadap matahari. Fase bulan ini meliputi beberapa tahap, seperti bulan baru, bulan sabit, bulan perbani, bulan cembung, dan bulan purnama. Perubahan ini mempengaruhi berbagai aspek di Bumi, seperti pasang surut air laut.')">
                <img src="fase.webp" alt="Poster Dunkirk">
                <h3>Fase Bulan</h3>
                <button class="btn-detail">Lihat Detail</button>
            </div>
             
                         
    </div>

    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="color: var(--electric-blue);"></h2>
            <p id="modalText"></p>
            
        </div>
    </div>

    <footer>
        <p>Nurlintang & Fitri</p>
    </footer>

    <script>
        // Mendapatkan elemen modal
        var modal = document.getElementById("movieModal");
        var modalTitle = document.getElementById("modalTitle");
        var modalText = document.getElementById("modalText");

        // Fungsi untuk membuka modal dan mengisi konten
        function openModal(title, description) {
            modalTitle.textContent = title;
            modalText.textContent = description;
            modal.style.display = "block";
        }

        // Fungsi untuk menutup modal
        function closeModal() {
            modal.style.display = "none";
        }

        // Menutup modal jika pengguna mengklik di luar area modal
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
